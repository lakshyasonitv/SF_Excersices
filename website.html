<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoC Inbound Lead Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            padding: 40px;
        }
        .form-card {
            background: #ffffff;
            max-width: 420px;
            margin: auto;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h2 { margin-top: 0; color: #16325c; font-size: 20px; }
        .form-row { margin-bottom: 14px; }
        label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #3e3e3c; }
        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #c9c7c5;
            border-radius: 4px;
        }
        input[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #0070d2;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
        }
        input[type="submit"]:hover { background-color: #005fb2; }

        /* THE BOT TRAP: Hidden completely from humans */
        .hidden-trap {
            display: none !important;
            visibility: hidden !important;
            opacity: 0;
            position: absolute;
            left: -9999px;
        }
    </style>
</head>
<body>

<div class="form-card">
    <h2>GoC Contact Request</h2>

    <!-- NOTE: If using a Developer Edition/Production org, keep webto.salesforce.com. If using a Sandbox, use test.salesforce.com -->
    <form action="https://test.salesforce.com/servlet/servlet.WebToLead?encoding=UTF-8&orgId=00Dhv000001Jhzx" method="POST">

        <input type="hidden" name="oid" value="00Dhv000001Jhzx">
        <input type="hidden" name="retURL" value="https://www.google.com">
        <input type="hidden" name="lead_source" value="Web">
        <input type="hidden" name="debug" value="1">

        <div class="form-row">
            <label for="first_name">First Name</label>
            <input id="first_name" name="first_name" type="text" maxlength="40">
        </div>

        <div class="form-row">
            <label for="last_name">Last Name *</label>
            <input id="last_name" name="last_name" type="text" maxlength="80" required>
        </div>

        <div class="form-row">
            <label for="email">Email *</label>
            <input id="email" name="email" type="email" maxlength="80" required>
        </div>

        <div class="form-row">
            <label for="company">Company *</label>
            <input id="company" name="company" type="text" maxlength="40" required>
        </div>

        <div class="form-row">
            <label for="city">City</label>
            <input id="city" name="city" type="text" maxlength="40" value="Dallas">
        </div>

        <!-- HONEYPOT BOT TRAP: Invisible to human users. Do not delete. -->
        <div class="hidden-trap">
            <label for="Honeypot__c">Leave this field blank</label>
            <input id="Honeypot__c" name="Honeypot__c" type="text" tabindex="-1" autocomplete="off">
        </div>

        <input type="submit" value="Submit Lead">
    </form>
</div>

</body>
</html>
